name: hammer-pr-ci

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync environment
        # --extra cache pulls psycopg2-binary so the PD cache modules
        # typecheck; the asap7 extras stay out (gdspy 1.4 builds from source).
        run: uv sync --locked --extra cache
      - name: Run unit tests
        run: uv run pytest tests/ -v
      - name: Type checking
        # Informational for now: pyright has not gated this fork's changes
        # (the poetry CI never ran), so it reports pre-existing issues.
        # Remove continue-on-error once the backlog is cleared.
        continue-on-error: true
        run: |
          touch .venv/lib/python${{ matrix.python-version }}/site-packages/ruamel/py.typed
          touch .venv/lib/python${{ matrix.python-version }}/site-packages/networkx/py.typed
          uv run pyright
