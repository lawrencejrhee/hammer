name: hammer-publish-ci

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Build
        # Stamp the release tag as the package version (pyproject carries a
        # placeholder 0.0.0), then build sdist + wheel with hatchling.
        run: |
          uv version ${{ github.event.release.tag_name }}
          uv build
      - name: Publish
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}
